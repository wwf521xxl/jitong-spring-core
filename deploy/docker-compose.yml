services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jitong
      POSTGRES_USER: jitong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jitong-demo-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jitong -d jitong"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      JITONG_DB_URL: jdbc:postgresql://postgres:5432/jitong
      JITONG_DB_USER: jitong
      JITONG_DB_PASSWORD: ${POSTGRES_PASSWORD:-jitong-demo-password}
      JITONG_JWT_SECRET: ${JITONG_JWT_SECRET:-jitong-demo-secret-please-change-0123456789abcdef}
      JITONG_COOKIE_SECURE: "false"
      JITONG_SEED_DEMO: "true"
      JITONG_SHOW_ACCOUNTS: "true"
      JITONG_ADMIN_PASSWORD: ${JITONG_ADMIN_PASSWORD:-Admin@123456}
    ports:
      - "8080:8080"
    volumes:
      - jitong-data:/app/data

volumes:
  postgres-data:
  jitong-data:
