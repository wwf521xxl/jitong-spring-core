server:
  port: ${JITONG_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: jitong-spring-core
  datasource:
    url: ${JITONG_DB_URL:jdbc:h2:file:./data/jitong;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${JITONG_DB_USER:sa}
    password: ${JITONG_DB_PASSWORD:}
    driver-class-name: ${JITONG_DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api/docs
    operations-sorter: alpha
    tags-sorter: alpha

jitong:
  data-dir: ${JITONG_DATA_DIR:./data}
  bootstrap-days: ${JITONG_BOOTSTRAP_DAYS:45}
  show-initial-accounts: ${JITONG_SHOW_ACCOUNTS:true}
  jwt:
    # 生产必须通过 JITONG_JWT_SECRET 覆盖（至少 32 字节）
    secret: ${JITONG_JWT_SECRET:jitong-spring-dev-secret-please-override-in-production-2026}
    issuer: jitong-spring-core
    access-ttl: ${JITONG_ACCESS_TTL:30m}
    refresh-ttl: ${JITONG_REFRESH_TTL:30d}
  cookie:
    name: jitong_session
    secure: ${JITONG_COOKIE_SECURE:false}
    same-site: ${JITONG_COOKIE_SAME_SITE:Lax}
  seed:
    demo: ${JITONG_SEED_DEMO:true}
    admin-password: ${JITONG_ADMIN_PASSWORD:Admin@123456}
    employee-pin: ${JITONG_EMPLOYEE_PIN:123456}
  security:
    login-max-attempts: ${JITONG_LOGIN_MAX_ATTEMPTS:20}
    login-window: ${JITONG_LOGIN_WINDOW:5m}
  cors:
    allowed-origins: ${JITONG_CORS_ORIGINS:}
