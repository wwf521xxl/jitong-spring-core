spring:
  datasource:
    url: jdbc:h2:mem:jitong-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

jitong:
  data-dir: ./target/test-data
  seed:
    demo: true
    admin-password: Admin@123456
    employee-pin: "123456"
  jwt:
    secret: jitong-test-secret-0123456789-abcdefghijklmnopqrstuvwxyz
    issuer: jitong-spring-core
  cookie:
    secure: false
  security:
    login-max-attempts: 1000
    login-window: 5m
